name: win-shell-child

on:
  workflow_dispatch:
  push:
    branches:
      - ci/win-shell-child

jobs:
  plugin-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run shell plugin tests
        run: cargo test --package tauri-plugin-shell --all-targets --all-features -- --test-threads=1 --nocapture

      - name: Clippy
        run: cargo clippy --package tauri-plugin-shell --all-targets --all-features -- -D warnings
